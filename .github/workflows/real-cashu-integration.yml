# SOLVENT Phase 1 — Real Cashu Foundation.
#
# Brings up a REAL regtest stack (Bitcoin Core + 2 real `lnd` nodes + a real
# CDK mint, backend `lnd` — no fakewallet) and runs
# src/cli/real-cashu/real-cashu-foundation.ts against it: real invoice
# payment, real NUT-04 issuance, real NUT-03 swap, real double-spend
# rejection, real NUT-05 melt. See docs/real-cashu-stack.md for the full
# architecture and docs/reproduce-real-stack.md to run this exact sequence
# yourself outside CI.
#
# Every binary is a pinned, checksum-verified prebuilt release — see
# docs/dependencies.md for exactly which versions and why. Nothing here
# builds Bitcoin Core, LND, or CDK from source.
#
# Fails closed: any step failing stops the job before the ones after it —
# there is no fallback path that reports success without the real stack
# actually running.
name: Real Cashu Integration (Phase 1)

on:
  workflow_dispatch: {}
  # Not run on every push/PR by default — this brings up real Bitcoin/
  # Lightning/Cashu processes and takes several minutes. Run on demand, or
  # uncomment a schedule once Phase 1 evidence needs to stay continuously
  # fresh (it currently does not — this proves a protocol capability, not
  # a time-bound demo artifact like refresh-live-demo.yml).
  # schedule:
  #   - cron: '0 8 * * 1'

env:
  BITCOIN_CORE_VERSION: '29.4'
  LND_VERSION: '0.21.3-beta'
  CDK_VERSION: '0.18.1'

jobs:
  real-cashu-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Download + verify Bitcoin Core ${{ env.BITCOIN_CORE_VERSION }}
        run: |
          set -euo pipefail
          cd /tmp
          # Download under the exact filename SHA256SUMS itself lists — a
          # renamed local file (e.g. `-o bitcoin.tar.gz`) cannot be verified
          # by `sha256sum -c`, which matches on the literal filename in the
          # sums file, not file content alone.
          curl -sSL -O "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -sSL -o SHA256SUMS "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_CORE_VERSION}/SHA256SUMS"
          grep "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz" SHA256SUMS | sha256sum -c -
          tar xzf "bitcoin-${BITCOIN_CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "/tmp/bitcoin-${BITCOIN_CORE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Download + verify LND ${{ env.LND_VERSION }}
        run: |
          set -euo pipefail
          cd /tmp
          curl -sSL -O "https://github.com/lightningnetwork/lnd/releases/download/v${LND_VERSION}/lnd-linux-amd64-v${LND_VERSION}.tar.gz"
          curl -sSL -o manifest.txt "https://github.com/lightningnetwork/lnd/releases/download/v${LND_VERSION}/manifest-v${LND_VERSION}.txt"
          grep "lnd-linux-amd64-v${LND_VERSION}.tar.gz" manifest.txt | sha256sum -c -
          tar xzf "lnd-linux-amd64-v${LND_VERSION}.tar.gz"
          echo "/tmp/lnd-linux-amd64-v${LND_VERSION}" >> "$GITHUB_PATH"

      - name: Download + verify CDK ${{ env.CDK_VERSION }} (cdk-mintd, real `lnd` backend compiled in)
        run: |
          set -euo pipefail
          mkdir -p /tmp/cdk && cd /tmp/cdk
          curl -sSL -O "https://github.com/cashubtc/cdk/releases/download/v${CDK_VERSION}/cdk-mintd-${CDK_VERSION}-x86_64"
          curl -sSL -o SHA256SUMS "https://github.com/cashubtc/cdk/releases/download/v${CDK_VERSION}/SHA256SUMS"
          grep "cdk-mintd-${CDK_VERSION}-x86_64" SHA256SUMS | sha256sum -c -
          chmod +x "cdk-mintd-${CDK_VERSION}-x86_64"
          ln -s "cdk-mintd-${CDK_VERSION}-x86_64" cdk-mintd
          echo "/tmp/cdk" >> "$GITHUB_PATH"

      - name: Start Bitcoin Core regtest
        run: |
          set -euo pipefail
          mkdir -p /tmp/regtest/bitcoin
          cat > /tmp/regtest/bitcoin/bitcoin.conf <<'EOF'
          regtest=1
          server=1
          txindex=1
          fallbackfee=0.0001
          rpcuser=solvent
          rpcpassword=solvent-regtest-only
          [regtest]
          rpcport=18443
          rpcbind=127.0.0.1
          rpcallowip=127.0.0.1
          zmqpubrawblock=tcp://127.0.0.1:28332
          zmqpubrawtx=tcp://127.0.0.1:28333
          EOF
          bitcoind -datadir=/tmp/regtest/bitcoin -daemon
          for i in $(seq 1 30); do
            # `if`'s condition is explicitly exempt from `set -e` — a bare
            # `cond && break` used as a top-level statement is NOT: if cond
            # is false on this iteration, the whole line's exit status is
            # non-zero and `set -e` aborts the script right here, never
            # reaching `sleep`/the next iteration. Every retry loop in this
            # workflow uses the `if`/`fi` form for exactly this reason.
            if bitcoin-cli -datadir=/tmp/regtest/bitcoin -regtest getblockchaininfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          bitcoin-cli -datadir=/tmp/regtest/bitcoin -regtest createwallet miner
          MINE_ADDR=$(bitcoin-cli -datadir=/tmp/regtest/bitcoin -regtest getnewaddress)
          echo "MINE_ADDR=$MINE_ADDR" >> "$GITHUB_ENV"
          bitcoin-cli -datadir=/tmp/regtest/bitcoin -regtest generatetoaddress 110 "$MINE_ADDR"

      - name: Start LND-1 (mint's real payment backend) and LND-2 (sender/destination)
        run: |
          set -euo pipefail
          for NODE in one two; do
            mkdir -p /tmp/regtest/lnd-$NODE
          done
          RPC_ONE=10009; REST_ONE=8080; P2P_ONE=9735
          RPC_TWO=10010; REST_TWO=8081; P2P_TWO=9736
          lnd --lnddir=/tmp/regtest/lnd-one --bitcoin.active --bitcoin.regtest --bitcoin.node=bitcoind \
            --bitcoind.rpchost=127.0.0.1:18443 --bitcoind.rpcuser=solvent --bitcoind.rpcpass=solvent-regtest-only \
            --bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332 --bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333 \
            --rpclisten=127.0.0.1:$RPC_ONE --restlisten=127.0.0.1:$REST_ONE --listen=127.0.0.1:$P2P_ONE \
            --noseedbackup --accept-keysend --protocol.wumbo-channels > /tmp/regtest/lnd-one/lnd.log 2>&1 &
          lnd --lnddir=/tmp/regtest/lnd-two --bitcoin.active --bitcoin.regtest --bitcoin.node=bitcoind \
            --bitcoind.rpchost=127.0.0.1:18443 --bitcoind.rpcuser=solvent --bitcoind.rpcpass=solvent-regtest-only \
            --bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332 --bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333 \
            --rpclisten=127.0.0.1:$RPC_TWO --restlisten=127.0.0.1:$REST_TWO --listen=127.0.0.1:$P2P_TWO \
            --noseedbackup --accept-keysend > /tmp/regtest/lnd-two/lnd.log 2>&1 &
          for i in $(seq 1 60); do
            if lncli --lnddir=/tmp/regtest/lnd-one --network=regtest --rpcserver=127.0.0.1:$RPC_ONE getinfo >/dev/null 2>&1 && \
               lncli --lnddir=/tmp/regtest/lnd-two --network=regtest --rpcserver=127.0.0.1:$RPC_TWO getinfo >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          echo "RPC_ONE=$RPC_ONE" >> "$GITHUB_ENV"; echo "REST_ONE=$REST_ONE" >> "$GITHUB_ENV"; echo "P2P_ONE=$P2P_ONE" >> "$GITHUB_ENV"
          echo "RPC_TWO=$RPC_TWO" >> "$GITHUB_ENV"; echo "REST_TWO=$REST_TWO" >> "$GITHUB_ENV"

      - name: Fund LND-2 and open a real regtest channel LND-2 -> LND-1
        run: |
          set -euo pipefail
          ONE="lncli --lnddir=/tmp/regtest/lnd-one --network=regtest --rpcserver=127.0.0.1:$RPC_ONE"
          TWO="lncli --lnddir=/tmp/regtest/lnd-two --network=regtest --rpcserver=127.0.0.1:$RPC_TWO"
          BTC="bitcoin-cli -datadir=/tmp/regtest/bitcoin -regtest"

          # lnd's gRPC server can answer `getinfo` (satisfying the previous
          # step's readiness poll) before the wallet subsystem underneath it
          # is ready for wallet-dependent calls like `newaddress` — a real,
          # observed race ("server is still in the process of starting").
          # Bounded retry on the first such call, rather than trusting a
          # single attempt right after the earlier getinfo-based poll.
          TWO_ADDR=""
          for i in $(seq 1 30); do
            TWO_ADDR=$($TWO newaddress p2wkh 2>/dev/null | jq -r .address 2>/dev/null || true)
            if [ -n "$TWO_ADDR" ] && [ "$TWO_ADDR" != "null" ]; then break; fi
            sleep 2
          done
          if [ -z "$TWO_ADDR" ] || [ "$TWO_ADDR" = "null" ]; then
            echo "LND-2 never became ready for wallet RPCs" >&2
            exit 1
          fi
          $BTC generatetoaddress 1 "$TWO_ADDR" >/dev/null
          $BTC generatetoaddress 100 "$MINE_ADDR" >/dev/null   # mature the coinbase output
          for i in $(seq 1 30); do
            BAL=$($TWO walletbalance 2>/dev/null | jq -r .confirmed_balance 2>/dev/null || echo 0)
            if [ "${BAL:-0}" != "0" ]; then break; fi
            sleep 1
          done

          ONE_PUBKEY=$($ONE getinfo | jq -r .identity_pubkey)
          echo "ONE_PUBKEY=$ONE_PUBKEY" >> "$GITHUB_ENV"

          # `connect` and `openchannel` can hit the same startup race as
          # `newaddress` above, just later: lnd's peer/channel RPC surface
          # can still answer "server is still in the process of starting"
          # for a few more seconds after wallet RPCs already work — a
          # real, observed race (`connect` tolerated it via `|| true`, but
          # the very next `openchannel` call then hit it unretried and
          # aborted the whole step). Bounded retry on both, but only for
          # that specific readiness error — any other failure (e.g. a real
          # funding/balance problem) still fails fast instead of being
          # silently retried away.
          for i in $(seq 1 15); do
            if CONNECT_OUT=$($TWO connect "$ONE_PUBKEY@127.0.0.1:$P2P_ONE" 2>&1); then break; fi
            if ! echo "$CONNECT_OUT" | grep -qi "still in the process of starting"; then break; fi
            sleep 2
          done

          # push_amt gives LND-1 (the mint's backend) real starting outbound
          # liquidity on its side of this single-funder channel — without
          # it, LND-1's only balance is whatever trickles in from R1's one
          # small inbound payment, which real channel-reserve requirements
          # then make effectively unspendable, so the mint's own outbound
          # melt payment genuinely fails with FAILURE_REASON_INSUFFICIENT_
          # BALANCE (observed for real, confirmed in the mint's own log —
          # not a guess).
          OPEN_OUT=""
          for i in $(seq 1 15); do
            if OPEN_OUT=$($TWO openchannel --node_key="$ONE_PUBKEY" --local_amt=5000000 --push_amt=2000000 --sat_per_vbyte=1 2>&1); then
              break
            fi
            if ! echo "$OPEN_OUT" | grep -qi "still in the process of starting"; then
              echo "$OPEN_OUT" >&2
              exit 1
            fi
            sleep 2
          done
          echo "$OPEN_OUT"
          if ! echo "$OPEN_OUT" | grep -q "funding_txid"; then
            echo "openchannel never succeeded after retries: $OPEN_OUT" >&2
            exit 1
          fi
          $BTC generatetoaddress 6 "$MINE_ADDR" >/dev/null

          for i in $(seq 1 60); do
            ACTIVE=$($TWO listchannels 2>/dev/null | jq -r '.channels | map(select(.active==true)) | length' 2>/dev/null || echo 0)
            if [ "${ACTIVE:-0}" -ge "1" ]; then break; fi
            sleep 2
          done
          $ONE listchannels
          $TWO listchannels

      - name: Start CDK mint (real `lnd` backend pointed at LND-1 — no fakewallet)
        run: |
          set -euo pipefail
          mkdir -p /tmp/regtest/mint
          # A fixed, well-known, publicly-documented BIP-39 test vector — this
          # workflow does not download cdk-cli, and a real/random mnemonic
          # buys nothing extra for a disposable regtest mint whose signing
          # identity is discarded at the end of every run anyway.
          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          cat > /tmp/regtest/mint/config.toml <<EOF
          [info]
          url = "http://127.0.0.1:8085"
          listen_host = "127.0.0.1"
          listen_port = 8085
          mnemonic = "env:CDK_MINTD_MNEMONIC"

          [database]
          engine = "sqlite"

          [payment_backend]
          backend = "lnd"
          unit = "sat"

          [lnd]
          address = "https://127.0.0.1:$RPC_ONE"
          cert_file = "/tmp/regtest/lnd-one/tls.cert"
          macaroon_file = "/tmp/regtest/lnd-one/data/chain/bitcoin/regtest/admin.macaroon"
          EOF
          # cdk-mintd 0.18.x moved to database-backed configuration: `--config`
          # is a legacy/migration-only flag now (confirmed against the pinned
          # release's own crates/cdk-mintd/src/cli.rs). A fresh mint's config
          # must be imported once via `config init --new-mint`, then the
          # daemon starts with no subcommand, reading from the database in
          # the same --work-dir.
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            config init --new-mint --file /tmp/regtest/mint/config.toml
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            > /tmp/regtest/mint/mintd.log 2>&1 &
          echo $! > /tmp/regtest/mint/mintd.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/v1/info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -s http://127.0.0.1:8085/v1/info | tee /tmp/regtest/mint/info.json

      - name: Apply Phase 2 SOLVENT accounting migration and prove atomicity
        env:
          CDK_MINT_URL: 'http://127.0.0.1:8085'
        run: |
          set -euo pipefail
          # Stop the mint before touching its database file directly — same
          # stop/restart pattern as the process-restart check, avoiding any
          # concurrent-writer risk while the migration and the synthetic
          # atomicity test run. CDK itself is never modified: this only adds
          # new tables/triggers to the same sqlite file — see
          # docs/accounting-model.md and docs/cdk-integration-seams.md.
          MINTD_PID=$(cat /tmp/regtest/mint/mintd.pid)
          kill "$MINTD_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$MINTD_PID" 2>/dev/null; then break; fi
            sleep 1
          done

          sqlite3 /tmp/regtest/mint/cdk-mintd.sqlite < migrations/solvent-accounting/0001_nut04_issued_liability.sql
          npm run verify:pol-atomicity -- /tmp/regtest/mint/cdk-mintd.sqlite

          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            >> /tmp/regtest/mint/mintd.log 2>&1 &
          echo $! > /tmp/regtest/mint/mintd.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/v1/info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8085/v1/info >/dev/null

      - name: Run the Phase 1 real-Cashu integration test
        env:
          CDK_MINT_URL: 'http://127.0.0.1:8085'
          LND_SOURCE_REST_URL: 'https://127.0.0.1:8081'
          LND_BACKEND_REST_URL: 'https://127.0.0.1:8080'
        run: |
          set -euo pipefail
          export LND_SOURCE_MACAROON_HEX=$(xxd -p -c 10000 /tmp/regtest/lnd-two/data/chain/bitcoin/regtest/admin.macaroon)
          export LND_BACKEND_MACAROON_HEX=$(xxd -p -c 10000 /tmp/regtest/lnd-one/data/chain/bitcoin/regtest/admin.macaroon)
          export NODE_TLS_REJECT_UNAUTHORIZED=0  # regtest LND self-signed certs only — see src/cli/real-cashu/lnd-client.ts's module header
          npm run verify:cashu-real

      - name: Prove NUT-04 retry idempotency (real second mint attempt)
        env:
          CDK_MINT_URL: 'http://127.0.0.1:8085'
        run: npm run verify:pol-retry

      - name: Reconcile Phase 2 accounting against real CDK state (pre-restart)
        run: |
          set -euo pipefail
          MINTD_PID=$(cat /tmp/regtest/mint/mintd.pid)
          kill "$MINTD_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$MINTD_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          npm run verify:pol-nut04 -- /tmp/regtest/mint/cdk-mintd.sqlite | tee /tmp/regtest/mint/pol-nut04-pre-restart.txt

          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            >> /tmp/regtest/mint/mintd.log 2>&1 &
          echo $! > /tmp/regtest/mint/mintd.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/v1/info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8085/v1/info >/dev/null

      - name: Restart CDK mint and verify persistence (process-restart check)
        env:
          CDK_MINT_URL: 'http://127.0.0.1:8085'
        run: |
          set -euo pipefail
          # Kill the mint process the earlier step started, then start a
          # fresh process against the SAME --work-dir (same sqlite
          # database) — this is what actually distinguishes durable
          # on-disk state from an in-memory artifact that a restart would
          # silently reset. See src/cli/real-cashu/real-cashu-restart-check.ts.
          MINTD_PID=$(cat /tmp/regtest/mint/mintd.pid)
          kill "$MINTD_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$MINTD_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            >> /tmp/regtest/mint/mintd.log 2>&1 &
          echo $! > /tmp/regtest/mint/mintd.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/v1/info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8085/v1/info >/dev/null
          npm run verify:cashu-real:restart

      - name: Reconcile Phase 2 accounting against real CDK state (post-restart)
        run: |
          set -euo pipefail
          # Proves P2-I10 (restart cannot lose committed accounting)
          # specifically for the SOLVENT journal, not just for CDK's own
          # proof state: the same reconciliation must report the exact same
          # numbers after this second real process restart as it did before
          # the first one.
          MINTD_PID=$(cat /tmp/regtest/mint/mintd.pid)
          kill "$MINTD_PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$MINTD_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          npm run verify:pol-nut04 -- /tmp/regtest/mint/cdk-mintd.sqlite | tee /tmp/regtest/mint/pol-nut04-post-restart.txt

          MNEMONIC="abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
          CDK_MINTD_MNEMONIC="$MNEMONIC" cdk-mintd --work-dir /tmp/regtest/mint \
            >> /tmp/regtest/mint/mintd.log 2>&1 &
          echo $! > /tmp/regtest/mint/mintd.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8085/v1/info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8085/v1/info >/dev/null

          if diff -q /tmp/regtest/mint/pol-nut04-pre-restart.txt /tmp/regtest/mint/pol-nut04-post-restart.txt >/dev/null; then
            echo "Restart persistence               PASS  identical reconciliation before and after restart"
          else
            echo "Restart persistence               FAIL  reconciliation differs before vs after restart" >&2
            diff /tmp/regtest/mint/pol-nut04-pre-restart.txt /tmp/regtest/mint/pol-nut04-post-restart.txt >&2 || true
            exit 1
          fi

      - name: Collect logs
        if: always()
        run: |
          mkdir -p /tmp/regtest-logs
          cp -r /tmp/regtest/bitcoin/regtest/debug.log /tmp/regtest-logs/bitcoind.log 2>/dev/null || true
          cp /tmp/regtest/lnd-one/lnd.log /tmp/regtest-logs/lnd-one.log 2>/dev/null || true
          cp /tmp/regtest/lnd-two/lnd.log /tmp/regtest-logs/lnd-two.log 2>/dev/null || true
          cp /tmp/regtest/mint/mintd.log /tmp/regtest-logs/mintd.log 2>/dev/null || true
          cp /tmp/regtest/mint/pol-nut04-pre-restart.txt /tmp/regtest-logs/pol-nut04-pre-restart.txt 2>/dev/null || true
          cp /tmp/regtest/mint/pol-nut04-post-restart.txt /tmp/regtest-logs/pol-nut04-post-restart.txt 2>/dev/null || true

      - name: Upload Phase 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cashu-evidence
          path: |
            evidence/real-cashu/
            evidence/real-pol/
            /tmp/regtest-logs/
          if-no-files-found: warn
          retention-days: 90
