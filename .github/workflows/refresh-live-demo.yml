# Keeps the published reference case behind /verify's Live check fresh.
#
# Why this exists: evidence/nostr/live-demo.json is bundled into the
# production JS at build time (a static `with { type: "json" }` import —
# see docs/trust-boundaries.md's "Making regeneration safe"), and its
# reserve attestation has a real, network-aware freshness window (~1 week
# on this build's network — see src/reserve/evaluate.ts's
# RESERVE_FRESHNESS_POLICY). This workflow regenerates it, publishes its
# Nostr event to real public relays, and fails closed at every step: it
# never hands on evidence it hasn't just proven is genuinely live, fresh,
# and internally consistent.
#
# It does not deploy by itself. On success it (1) uploads the verified
# evidence as the `live-evidence` artifact, which deploy-site.yml (triggered
# by this run's completion) builds into the GitHub Pages mirror, and (2)
# commits exactly that file to main, which the canonical Vercel app
# (https://solvent-ashen.vercel.app/, built from git) redeploys from. Site deployment never
# depends on this workflow succeeding: when relays are unreachable this run
# fails, and the site keeps serving the last verified evidence — whose live
# check then truthfully reports its own state.
#
# Freshness window:  ~7 days (network-aware; see RESERVE_FRESHNESS_POLICY)
# Refresh cadence:    twice a day, up to 3 publish attempts per run
# Safety margin:     ~6 days — a relay or CI outage lasting days still does
#                     not expire the deployed evidence.
#
# Manual fallback (if this workflow is disabled or failing): run
# `npm run live-demo` locally, commit evidence/nostr/live-demo.json, and
# push — Vercel and deploy-site.yml both deploy it. See README.md.
name: Refresh Live Evidence

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Only one refresh in flight at a time — a second scheduled/manual run
# overlapping the first could publish two different Nostr events for two
# different reference identities back to back, which is wasteful (not
# unsafe: each identity is independently correct — see
# docs/trust-boundaries.md's "Why the demo mint identity is NOT persisted" —
# but there is no reason to do it twice concurrently).
concurrency:
  group: refresh-live-demo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # ---- Fail-closed gates, in order. Any failure stops the job before
      # ---- anything is uploaded — see module header.
      #
      # Public relays sometimes refuse or time out connections from CI
      # runners. live-demo.ts exits non-zero without writing the evidence
      # file when no relay accepts the publish, so retrying is safe; three
      # failures in a row fail the run. (A publish that a relay accepted but
      # the immediate fetch-back didn't see yet still writes the file —
      # verify:live-demo below is what gates that.)
      - name: Regenerate + publish the reference case (real Nostr publish, real Signet reserve query)
        run: |
          for attempt in 1 2 3; do
            if npm run live-demo; then exit 0; fi
            echo "::warning::live-demo attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then sleep 120; fi
          done
          exit 1

      - name: Verify the regenerated evidence is genuinely live, fresh, and ACCEPT_VERIFIED
        run: npm run verify:live-demo

      - name: Deterministic test suite
        run: npm test

      - name: Full attack corpus
        run: npm run attacks

      - name: Submission gate (mechanism + the canonical evidence just generated above)
        run: npm run verify:submission

      - name: Hand the verified evidence to the site deploy
        uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: evidence/nostr/live-demo.json
          retention-days: 30
          if-no-files-found: error

      # The canonical app (Vercel) builds from git, so the verified evidence
      # must reach main. Only this one file is committed (the attack run above
      # rewrites evidence/attacks/, which is not part of the refresh).
      - name: Commit the verified evidence to main (redeploys the Vercel app)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/nostr/live-demo.json
          if git diff --cached --quiet; then echo "evidence unchanged"; exit 0; fi
          git commit -m 'chore: refresh the published reference evidence'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
